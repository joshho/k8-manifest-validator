name: release
on:
  push:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    tags:
      - 'v[0-9]+.[0-9]+-[0-9]+'
      - 'v[0-9]+.[0-9]+'

# Fires on:
#   - prerelease tags: v1.36-0, v1.36-1 (test.yml pushes these)
#   - stable tags: v1.36 (manually pushed or version-bump.yml)
#   - NOT on patch-only tags like v1.36.1 (hyphen vs dot)
# test.yml handles go test ./... on every main push.
# This workflow handles goreleaser release build → script-driven dual releases.

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: build --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator
            dist/k8-manifest-validator_linux_arm64_v8.0/k8-manifest-validator
            dist/k8-manifest-validator_darwin_amd64_v1/k8-manifest-validator
            dist/k8-manifest-validator_darwin_arm64_v8.0/k8-manifest-validator
            dist/*.txt
          retention-days: 1

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Make artifacts executable
        run: |
          chmod +x dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_linux_arm64_v8.0/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_darwin_amd64_v1/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_darwin_arm64_v8.0/k8-manifest-validator

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Create/update releases
        run: ./scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}