name: release
on:
  push:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    tags:
      - 'v[0-9]+.[0-9]+-[0-9]+'

# Triggered ONLY when a tag matching v{MAJOR}.{MINOR}-{PATCH} is pushed.
# test.yml handles go test ./... on every main push.
# This workflow handles goreleaser release build → script-driven dual releases.

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/k8-manifest-validator_linux_amd64/k8-manifest-validator
            dist/k8-manifest-validator_linux_arm64/k8-manifest-validator
            dist/k8-manifest-validator_darwin_amd64/k8-manifest-validator
            dist/k8-manifest-validator_darwin_arm64/k8-manifest-validator
            dist/*.txt
          retention-days: 1

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Make artifacts executable
        run: |
          chmod +x dist/k8-manifest-validator_linux_amd64/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_linux_arm64/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_darwin_amd64/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_darwin_arm64/k8-manifest-validator

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Create/update releases
        run: ./scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}