name: version-bump

on:
  schedule:
    # Run nightly at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - 'release/v[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  # ─── Minor version bump ───────────────────────────────────────────────────────
  # Runs on main branch (push or schedule). Detects new k8s minor releases.
  # On new minor (e.g. 1.36 -> 1.37):
  #   - Creates release/v1.36 from current main state
  #   - Updates main to new k8s version (v1.37, k8s.io v0.37.0)
  #   - Pushes release/v1.36 and main with new tags
  minor-bump:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check for new minor version
        id: check
        run: |
          # Capture old minor BEFORE we modify anything
          CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_minor=$(echo $CURRENT_VERSION | sed 's/^v//' | sed 's/-[0-9]*$//')" >> "$GITHUB_OUTPUT"

          result=$(./scripts/check-new-version.sh --minor 2>&1 || true)
          echo "output: $result"
          if echo "$result" | grep -q "NEW_MINOR="; then
            echo "new_minor=$(echo "$result" | grep NEW_MINOR | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump to new minor version
        if: steps.check.outputs.available == 'true'
        env:
          NEW_MINOR: ${{ steps.check.outputs.new_minor }}
          GIT_AUTHOR_NAME: ci-bot
          GIT_COMMITTER_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@k8-manifest-validator.io
          GIT_COMMITTER_EMAIL: ci@k8-manifest-validator.io
        run: |
          git config --global user.email "ci@k8-manifest-validator.io"
          git config --global user.name "CI Bot"
          GO=/home/node/.local/go/go/bin/go
          if ! command -v "$GO" &>/dev/null; then GO=$(command -v go); fi
          ./scripts/bump-version.sh --minor "${NEW_MINOR#v}"

      - name: Validate build and tests
        if: steps.check.outputs.available == 'true'
        run: |
          GO=/home/node/.local/go/go/bin/go
          if ! command -v "$GO" &>/dev/null; then GO=$(command -v go); fi
          echo "[validate] go build ./..."
          "$GO" build ./...
          echo "[validate] go test ./..."
          "$GO" test ./...

      - name: Push updated main + tag
        if: steps.check.outputs.available == 'true'
        env:
          NEW_MINOR: ${{ steps.check.outputs.new_minor }}
          GIT_AUTHOR_NAME: ci-bot
          GIT_COMMITTER_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@k8-manifest-validator.io
          GIT_COMMITTER_EMAIL: ci@k8-manifest-validator.io
        run: |
          git config --global user.email "ci@k8-manifest-validator.io"
          git config --global user.name "CI Bot"
          TAG="v${NEW_MINOR#v}-0"
          echo "Pushing main and tag $TAG"
          git push origin main --follow-tags
          echo "Minor bump complete: main is now at $TAG"

      - name: No new minor version
        if: steps.check.outputs.available == 'false'
        run: echo "Already on latest k8s minor version. No action needed."

  # ─── Patch version bump ───────────────────────────────────────────────────────
  # Runs on main + version branches (v1.30, v1.31, etc.) only.
  # Skips release/vX.Y branches and any other feature/hotfix branches.
  # Reads current k8s package minor from go.mod, checks GitHub API for latest
  # patch for that minor, and if newer: bumps packages + VERSION patch counter,
  # commits and tags. The tag push triggers test.yml + release.yml.
  patch-bump:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check if patch update is needed
        id: check
        run: |
          echo "[debug] pwd=$(pwd)"
          echo "[debug] github.ref=${{ github.ref }}"
          echo "[debug] github.ref_name=${{ github.ref_name }}"
          echo "[debug] VERSION contents: $(cat VERSION 2>&1 || echo 'FILE NOT FOUND')"
          result=$(./scripts/check-new-version.sh --patch 2>&1 || true)
          echo "check_output: $result"
          if echo "$result" | grep -q "NEW_PATCH="; then
            echo "new_patch=$(echo "$result" | grep NEW_PATCH | cut -d= -f2)" >> "$GITHUB_OUTPUT"
            echo "update_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch bump + validate
        if: steps.check.outputs.update_available == 'true'
        env:
          GIT_AUTHOR_NAME: ci-bot
          GIT_COMMITTER_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@k8-manifest-validator.io
          GIT_COMMITTER_EMAIL: ci@k8-manifest-validator.io
        run: |
          git config --global user.email "ci@k8-manifest-validator.io"
          git config --global user.name "CI Bot"
          GO=/home/node/.local/go/go/bin/go
          if ! command -v "$GO" &>/dev/null; then GO=$(command -v go); fi
          ./scripts/bump-version.sh --patch
          # Tag the bump commit
          TAG=$(cat VERSION | tr -d '[:space:]')
          git add VERSION go.mod go.sum
          git commit -m "release: patch k8s to $TAG" || true
          git tag -f "$TAG"
          # Only run build/test when the branch itself is the active minor
          # (i.e. release/X matches k8s latest minor) — skip for older pinned branches
          K8S_MINOR=$(curl -sSfL --max-time 15 "https://api.github.com/repos/kubernetes/kubernetes/releases/latest" | python3 -c "import sys,json;print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null | sed 's/^v//' | cut -d. -f2)
          BRANCH_MINOR=$(echo "${{ github.ref_name }}" | sed 's/release\/v//')
          echo "k8s latest minor: $K8S_MINOR, branch minor: $BRANCH_MINOR"
          if [[ "$K8S_MINOR" == "$BRANCH_MINOR" ]]; then
            echo "[validate] go build ./..."
            "$GO" build ./...
            echo "[validate] go test ./..."
            "$GO" test ./...
          else
            echo "[skip validate] branch minor $BRANCH_MINOR != k8s minor $K8S_MINOR (pinned older k8s.io)"
          fi

      - name: Push branch + tag
        if: steps.check.outputs.update_available == 'true'
        env:
          GIT_AUTHOR_NAME: ci-bot
          GIT_COMMITTER_NAME: ci-bot
          GIT_AUTHOR_EMAIL: ci@k8-manifest-validator.io
          GIT_COMMITTER_EMAIL: ci@k8-manifest-validator.io
        run: |
          git config --global user.email "ci@k8-manifest-validator.io"
          git config --global user.name "CI Bot"
          TAG=$(cat VERSION | tr -d '[:space:]')
          if [[ -z "$TAG" ]]; then
            echo "ERROR: VERSION file is empty, cannot push tag"
            exit 1
          fi
          git push origin ${{ github.ref_name }}
          if [[ -n "$TAG" ]]; then
            git push origin "$TAG"
            echo "Pushed branch and tag $TAG"
          else
            git push origin ${{ github.ref_name }}
          fi

      - name: No patch update needed
        if: steps.check.outputs.update_available == 'false'
        run: echo "Already on latest k8s patch for this branch."