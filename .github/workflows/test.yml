name: test
on:
  push:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: build --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: k8-manifest-validator
          path: |
            dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator
            dist/k8-manifest-validator_linux_arm64_v8.0/k8-manifest-validator
            dist/k8-manifest-validator_darwin_amd64_v1/k8-manifest-validator
            dist/k8-manifest-validator_darwin_arm64_v8.0/k8-manifest-validator
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Copy linux-amd64 binary for tests
        run: |
          cp dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator dist/k8-manifest-validator
          chmod +x dist/k8-manifest-validator

      - name: Run unit tests
        run: go test ./...

      - name: Run fixture tests
        run: ./scripts/test.sh

  tag-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Determine next release tag
        id: next_tag
        run: |
          set -x
          K8S_MINOR=$(cat VERSION | tr -d '[:space:]')
          echo "k8s_minor=$K8S_MINOR"

          LAST_NUM=$(gh release list --repo joshho/k8-manifest-validator --limit 50 2>/dev/null | \
            grep -E '^v[0-9]+\.[0-9]+-[0-9]+' | \
            grep -v '^Release ' | \
            sed -n "s/^v${K8S_MINOR#v}-\([0-9]*\).*/\1/p" | \
            sort -n | tail -1 || true)

          if [[ -z "$LAST_NUM" ]]; then
            PATCH_NUM=0
          else
            PATCH_NUM=$((LAST_NUM + 1))
          fi

          TAG="v${K8S_MINOR#v}-${PATCH_NUM}"
          STABLE_TAG="v${K8S_MINOR#v}"
          echo "tag=$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "stable_tag=$STABLE_TAG" >> $GITHUB_OUTPUT

      - name: Push git tags for release.yml
        run: |
          set -x
          TAG="${{ steps.next_tag.outputs.tag }}"
          STABLE_TAG="${{ steps.next_tag.outputs.stable_tag }}"

          # NOTE: we only push git tags here — GitHub releases are created by
          # release.yml (triggered by these tag pushes) which runs goreleaser
          # build + release.sh for the dual-release (stable + prerelease).
          git config --global user.email "ci@k8-manifest-validator.dev"
          git config --global user.name "CI Bot"
          git tag -f "$TAG" -m "Prerelease $TAG"
          git push -f origin "refs/tags/$TAG"
          git tag -f "$STABLE_TAG" -m "Stable release $STABLE_TAG"
          git push -f origin "refs/tags/$STABLE_TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
