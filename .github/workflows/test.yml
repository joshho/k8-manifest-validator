name: test
on:
  push:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ~> v2
          args: build --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/

      - name: Make executable and test
        run: |
          chmod +x dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator
          cp dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator dist/k8-manifest-validator
          ./scripts/test.sh

  tag-and-release:
    needs: test
    if: github.event_name == 'push' && needs.test.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/

      - name: Make all binaries executable
        run: |
          ls -laR dist/ | head -60
          chmod +x dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator || echo "linux_amd64_v1 NOT FOUND"
          cp dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator dist/k8-manifest-validator 2>/dev/null || echo "copy FAILED"
          chmod +x dist/k8-manifest-validator_linux_arm64_v8.0/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_darwin_amd64_v1/k8-manifest-validator
          chmod +x dist/k8-manifest-validator_darwin_arm64_v8.0/k8-manifest-validator

      - name: Determine next release tag
        id: next_tag
        run: |
          K8S_MINOR=$(cat VERSION | tr -d '[:space:]')
          echo "k8s_minor=$K8S_MINOR"

          LAST_NUM=$(gh release list --repo joshho/k8-manifest-validator --limit 50 2>/dev/null | \
            grep -E '^v[0-9]+\.[0-9]+-[0-9]+' | \
            grep -v '^Release ' | \
            sed -n "s/^v${K8S_MINOR#v}-\\([0-9]*\\).*/\\1/p" | \
            sort -n | tail -1 || true)

          if [[ -z "$LAST_NUM" ]]; then
            PATCH_NUM=0
          else
            PATCH_NUM=$((LAST_NUM + 1))
          fi

          TAG="v${K8S_MINOR#v}-${PATCH_NUM}"
          echo "tag=$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with all binaries
        run: |
          set -x
          TAG="${{ steps.next_tag.outputs.tag }}"
          ARTIFACTS=(
            "dist/k8-manifest-validator_linux_amd64_v1/k8-manifest-validator"
            "dist/k8-manifest-validator_linux_arm64_v8.0/k8-manifest-validator"
            "dist/k8-manifest-validator_darwin_amd64_v1/k8-manifest-validator"
            "dist/k8-manifest-validator_darwin_arm64_v8.0/k8-manifest-validator"
          )

          # Verify all artifacts exist
          for f in "${ARTIFACTS[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: artifact missing: $f"
              ls -la dist/
              exit 1
            fi
          done

          # Create release (without assets first, then upload each separately)
          # This avoids the 404 error when attaching multiple assets at once
          if gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "Release $TAG built by CI — multi-platform" \
            --repo joshho/k8-manifest-validator 2>&1; then
            echo "Release $TAG created"
          else
            echo "[$TAG] already exists — will update assets"
          fi

          # Upload each artifact with a distinct name per platform
          for f in "${ARTIFACTS[@]}"; do
            case "$f" in
              *linux_amd64*) platform="linux-amd64" ;;
              *linux_arm64*) platform="linux-arm64" ;;
              *darwin_amd64*) platform="darwin-amd64" ;;
              *darwin_arm64*) platform="darwin-arm64" ;;
              *) platform="$(basename "$f")" ;;
            esac
            # Copy to temp name, then upload (gh upload uses basename as asset name)
            tmpfile="/tmp/$(basename "$f" .container)-$(echo "$f" | sed 's/.*k8-manifest-validator_/k8-manifest-validator_/' | sed 's|/k8-manifest-validator||')
            cp "$f" "$tmpfile"
            gh release upload "$TAG" "$tmpfile" \
              --repo joshho/k8-manifest-validator \
              --clobber
            echo "Uploaded: $f as $(basename "$tmpfile")"
            rm -f "$tmpfile"
            echo "Uploaded: $f as $platform"
          done

          K8S_MINOR=$(echo "$TAG" | grep -oP '^v\K[0-9]+\.[0-9]+')
          STABLE_TAG="v${K8S_MINOR}"
          echo "Ensuring stable release $STABLE_TAG"

          # Same for stable release
          for f in "${ARTIFACTS[@]}"; do
            case "$f" in
              *linux_amd64*) platform="linux-amd64" ;;
              *linux_arm64*) platform="linux-arm64" ;;
              *darwin_amd64*) platform="darwin-amd64" ;;
              *darwin_arm64*) platform="darwin-arm64" ;;
              *) platform="$(basename "$f")" ;;
            esac
            tmpfile="/tmp/$(basename "$f" .container)-$(echo "$f" | sed 's/.*k8-manifest-validator_/k8-manifest-validator_/' | sed 's|/k8-manifest-validator||')
            cp "$f" "$tmpfile"
            gh release upload "$STABLE_TAG" "$tmpfile" \
              --repo joshho/k8-manifest-validator \
              --clobber
            echo "Uploaded: $f as $(basename "$tmpfile")"
            rm -f "$tmpfile"
            echo "Uploaded: $f as $platform to $STABLE_TAG"
          done
          gh release edit "$STABLE_TAG" --repo joshho/k8-manifest-validator --latest true 2>/dev/null || true


