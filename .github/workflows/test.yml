name: test
on:
  push:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+'
    paths-ignore:
      - '.github/workflows/**'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: ./scripts/build.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/k8-manifest-validator
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/

      - name: Make executable
        run: chmod +x dist/k8-manifest-validator

      - name: Test
        run: |
          chmod +x dist/k8-manifest-validator
          ./scripts/test.sh

  tag-and-release:
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: k8-manifest-validator
          path: dist/

      - name: Make executable
        run: chmod +x dist/k8-manifest-validator

      - name: Determine next release tag
        id: next_tag
        run: |
          VERSION_CONTENT=$(grep -v '^[ ]*$' VERSION | head -1)
          K8S_MINOR=$(echo "$VERSION_CONTENT" | grep -oP '^v\K[0-9]+\.[0-9]+')
          if [[ -z "$K8S_MINOR" ]]; then
            echo "ERROR: Could not parse k8s minor from VERSION"
            exit 1
          fi

          LAST_TAG=$(gh release list --repo joshho/k8-manifest-validator --limit 50 2>/dev/null | \
            awk -v minor="$K8S_MINOR" '$2 ~ "^v" minor "-" { print $2 }' | \
            sort -V | tail -1 || true)

          if [[ -z "$LAST_TAG" ]]; then
            PATCH_NUM=0
          else
            PATCH_NUM="${LAST_TAG##*-}"
            PATCH_NUM=$((PATCH_NUM + 1))
          fi

          TAG="v${K8S_MINOR}-${PATCH_NUM}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Debug condition
        run: |
          echo "test.conclusion=${{ needs.test.conclusion }}"

      - name: Create and push tag
        if: needs.test.conclusion == 'success'
        continue-on-error: true
        run: |
          set -x
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TAG="${{ steps.next_tag.outputs.tag }}"
          echo "Creating and pushing tag: $TAG"
          git tag -a "$TAG" -m "Automatic release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG pushed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
