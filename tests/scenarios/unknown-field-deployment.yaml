# kubeconform-aligned scenario: Deployment with unknown field
# Both kubeconform and our validator should flag this as invalid
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
  fakeField: value
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
  fakeTopLevelField: value
