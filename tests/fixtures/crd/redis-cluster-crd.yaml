apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redisclusters.redisilient.github.com
spec:
  group: redisilient.github.com
  names:
    kind: RedisCluster
    plural: redisclusters
    singular: rediscluster
    listKind: RedisClusterList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              kubernetesConfig:
                type: object
                properties:
                  image:
                    type: string
                    minLength: 1
                  imagePullPolicy:
                    type: string
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                  env:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                  resources:
                    type: object
                    properties:
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      requests:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                required:
                - image
              clusterSize:
                type: integer
                minimum: 1
                maximum: 100
              redisConfig:
                type: object
                properties:
                  maxmemory:
                    type: string
                  maxmemoryPolicy:
                    type: string
                    enum:
                    - allkeys-lru
                    - allkeys-lfu
                    - allkeys-random
                    - volatile-lru
                    - volatile-lfu
                    - volatile-random
                    - volatile-ttl
                    - noeviction
                  appendonly:
                    type: string
                    enum:
                    - "yes"
                    - "no"
              storage:
                type: object
                properties:
                  persistentVolumeClaim:
                    type: object
                    properties:
                      claimName:
                        type: string
            required:
            - kubernetesConfig
            - clusterSize