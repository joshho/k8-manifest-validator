apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pgreplicas.postgres-operator.crunchydata.com
spec:
  group: postgres-operator.crunchydata.com
  names:
    kind: Pgreplica
    plural: pgreplicas
    singular: pgreplica
    listKind: PgreplicaList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              clusterName:
                type: string
              replicaName:
                type: string
              source:
                type: object
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
              image:
                type: string
              serviceType:
                type: string
                enum:
                - ClusterIP
                - NodePort
                - LoadBalancer
              resources:
                type: object
                properties:
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
            required:
            - clusterName
          status:
            type: object