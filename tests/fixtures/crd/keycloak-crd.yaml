apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keycloaks.keycloak.org
spec:
  group: keycloak.org
  names:
    kind: Keycloak
    plural: keycloaks
    singular: keycloak
    listKind: KeycloakList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              instances:
                type: integer
                minimum: 1
                maximum: 10
              version:
                type: string
              image:
                type: string
              resources:
                type: object
                properties:
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
              externalDatabase:
                type: object
                properties:
                  enabled:
                    type: boolean
                  host:
                    type: string
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
              tls:
                type: object
                properties:
                  enabled:
                    type: boolean
                  secretName:
                    type: string
              ingress:
                type: object
                properties:
                  enabled:
                    type: boolean
                  className:
                    type: string
                  hostname:
                    type: string
                  annotations:
                    type: object
                    additionalProperties:
                      type: string
            required:
            - instances
            - version
          status:
            type: object
            properties:
              ready:
                type: integer
              replicas:
                type: integer
