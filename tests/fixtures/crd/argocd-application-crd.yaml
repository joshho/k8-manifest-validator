apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: Application
    plural: applications
    singular: application
    listKind: ApplicationList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              project:
                type: string
              source:
                type: object
                properties:
                  repoURL:
                    type: string
                  targetRevision:
                    type: string
                  path:
                    type: string
                  chart:
                    type: string
                  helm:
                    type: object
                  kustomize:
                    type: object
                required:
                - repoURL
              destination:
                type: object
                properties:
                  server:
                    type: string
                  namespace:
                    type: string
                  name:
                    type: string
                required:
                - namespace
              syncPolicy:
                type: object
                properties:
                  automated:
                    type: object
                  syncOptions:
                    type: array
                    items:
                      type: string
              ignoreDifferences:
                type: array
              info:
                type: array
            required:
            - project
            - source
            - destination
          status:
            type: object