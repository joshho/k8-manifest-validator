apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gitrepositories.source.toolkit.fluxcd.io
spec:
  group: source.toolkit.fluxcd.io
  names:
    kind: GitRepository
    plural: gitrepositories
    singular: gitrepository
    listKind: GitRepositoryList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              interval:
                type: string
              timeout:
                type: string
              ref:
                type: object
                properties:
                  branch:
                    type: string
                  tag:
                    type: string
                  semver:
                    type: string
                  commit:
                    type: string
              url:
                type: string
              secretRef:
                type: object
                properties:
                  name:
                    type: string
              ignore:
                type: string
              suspend:
                type: boolean
              gitImplementation:
                type: string
            required:
            - interval
            - url