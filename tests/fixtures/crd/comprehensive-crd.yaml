                type: string
                enum:
                - option-a
            required:
            - choiceField
          - properties:
              choiceField:
                type: string
                enum:
                - option-b
            required:
            - choiceField
          allOf:
          - properties:
              logicalField:
                type: string
                minLength: 5
            required:
            - logicalField
          anyOf:
          - properties:
              logicalField:
                type: string
                pattern: "^prefix-"
            required:
            - logicalField
          - properties:
              logicalField:
                type: string
                pattern: "^suffix$"
            required:
            - logicalField
          not:
            properties:
              logicalField:
                type: string
                pattern: "^forbidden-"
