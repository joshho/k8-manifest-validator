apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkatopics.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  names:
    kind: KafkaTopic
    plural: kafkatopics
    singular: kafkatopic
    listKind: KafkaTopicList
  scope: Namespaced
  versions:
  - name: v1beta2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              partitions:
                type: integer
                minimum: 1
              replicas:
                type: integer
                minimum: 1
              config:
                type: object
              topicName:
                type: string
            required:
            - partitions
            - replicas
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkausers.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  names:
    kind: KafkaUser
    plural: kafkausers
    singular: kafkauser
    listKind: KafkaUserList
  scope: Namespaced
  versions:
  - name: v1beta2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              authentication:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - tls
                      - scram-sha-512
                      - scram-sha-256
                required:
                  - type
              authorization:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - simple
                      - allow
                required:
                  - type
              quotas:
                type: object
            required:
            - authentication
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkaconnects.kafka.strimzi.io
spec:
  group: kafka.strimzi.io
  names:
    kind: KafkaConnect
    plural: kafkaconnects
    singular: kafkaconnect
    listKind: KafkaConnectList
  scope: Namespaced
  versions:
  - name: v1beta2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
              bootstrapServers:
                type: string
              tls:
                type: object
              authentication:
                type: object
              logging:
                type: object
              resources:
                type: object
            required:
            - bootstrapServers