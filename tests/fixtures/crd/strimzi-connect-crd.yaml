apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkaconnects.strimzi.io
spec:
  group: strimzi.io
  names:
    kind: KafkaConnect
    plural: kafkaconnects
    singular: kafkaconnect
    listKind: KafkaConnectList
  scope: Namespaced
  versions:
  - name: v1beta2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
              bootstrapServers:
                type: string
              tls:
                type: object
              authentication:
                type: object
              logging:
                type: object
              resources:
                type: object
            required:
            - bootstrapServers
  storedVersions:
  - v1beta2