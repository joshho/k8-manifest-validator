apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: installs.installation.toolkit.fluxcd.io
spec:
  group: installation.toolkit.fluxcd.io
  names:
    kind: FluxInstall
    plural: fluxinstalls
    singular: fluxinstall
    listKind: FluxInstallList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              version:
                type: string
              interval:
                type: string
              clusterProvider:
                type: string
              components:
                type: array
                items:
                  type: string
              registry:
                type: string
              resources:
                type: object
              namespace:
                type: string
              watchAllNamespaces:
                type: boolean
              allAtOnce:
                type: boolean
            required:
            - version
            - interval