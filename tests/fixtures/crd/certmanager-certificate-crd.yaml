apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Certificate
    plural: certificates
    singular: certificate
    listKind: CertificateList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              secretName:
                type: string
              secretTemplate:
                type: object
                properties:
                  labels:
                    type: object
                    additionalProperties:
                      type: string
                  annotations:
                    type: object
                    additionalProperties:
                      type: string
              issuerRef:
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                  group:
                    type: string
                required:
                - name
              commonName:
                type: string
              duration:
                type: string
              renewBefore:
                type: string
              dnsNames:
                type: array
                items:
                  type: string
              ipAddresses:
                type: array
                items:
                  type: string
              emailSANs:
                type: array
                items:
                  type: string
              uriSANs:
                type: array
                items:
                  type: string
              usages:
                type: array
                items:
                  type: string
              privateKey:
                type: object
                properties:
                  rotationPolicy:
                    type: string
                  encoding:
                    type: string
                  algorithm:
                    type: string
                  size:
                    type: integer
              encodeUsagesInRequest:
                type: boolean
              nameConstraints:
                type: object
                properties:
                  permitted:
                    type: object
                    properties:
                      dns:
                        type: array
                        items:
                          type: string
                      email:
                        type: array
                        items:
                          type: string
                      uri:
                        type: array
                        items:
                          type: string
                  excluded:
                    type: object
              revisionHistoryLimit:
                type: integer
            required:
            - secretName
            - issuerRef
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
              nextPrivateKeySecretName:
                type: string
              secretName:
                type: string
