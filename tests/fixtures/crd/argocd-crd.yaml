apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: argocds.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: ArgoCD
    plural: argocds
    singular: argocd
    listKind: ArgoCDList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              server:
                type: object
                properties:
                  replicas:
                    type: integer
                    minimum: 1
                  insecure:
                    type: boolean
                  host:
                    type: string
              repo:
                type: object
                properties:
                  replicas:
                    type: integer
                    minimum: 1
                  resources:
                    type: object
              controller:
                type: object
                properties:
                  replicas:
                    type: integer
                    minimum: 1
              image:
                type: string
              version:
                type: string
              namespace:
                type: string
              rbac:
                type: object
              redis:
                type: object
              metrics:
                type: object