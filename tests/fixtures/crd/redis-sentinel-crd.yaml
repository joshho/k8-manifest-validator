apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redissentinels.redisilient.github.com
spec:
  group: redisilient.github.com
  names:
    kind: RedisSentinel
    plural: redissentinels
    singular: redissentinel
    listKind: RedisSentinelList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              kubernetesConfig:
                type: object
                properties:
                  image:
                    type: string
                  imagePullPolicy:
                    type: string
                  env:
                    type: array
                    items:
                      type: object
                  resources:
                    type: object
              sentinelConfig:
                type: object
                properties:
                  quorum:
                    type: integer
                  downAfterMilliseconds:
                    type: integer
                  failTimeout:
                    type: integer
              redisConfig:
                type: object
                properties:
                  maxmemory:
                    type: string
                  maxmemoryPolicy:
                    type: string
              masterSize:
                type: string
              storage:
                type: object
            required:
            - kubernetesConfig
