apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmrepositories.source.toolkit.fluxcd.io
spec:
  group: source.toolkit.fluxcd.io
  names:
    kind: HelmRepository
    plural: helmrepositories
    singular: helmrepository
    listKind: HelmRepositoryList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              interval:
                type: string
              timeout:
                type: string
              url:
                type: string
              secretRef:
                type: object
                properties:
                  name:
                    type: string
              passCredentials:
                type: boolean
              provider:
                type: string
              suspend:
                type: boolean
            required:
            - interval
            - url