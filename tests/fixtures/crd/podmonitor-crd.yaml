apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podmonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: PodMonitor
    plural: podmonitors
    singular: podmonitor
    listKind: PodMonitorList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              jobName:
                type: string
              podMetricsEndpoints:
                type: array
              selector:
                type: object
              namespaceSelector:
                type: object
              podTargetLabels:
                type: array
                items:
                  type: string
            required:
            - jobName
            - podMetricsEndpoints
            - selector