apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationsets.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: ApplicationSet
    plural: applicationsets
    singular: applicationset
    listKind: ApplicationSetList
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              generators:
                type: array
                items:
                  type: object
              template:
                type: object
                properties:
                  metadata:
                    type: object
                  spec:
                    type: object
                required:
                - metadata
                - spec
              syncPolicy:
                type: object
              strategy:
                type: array
                items:
                  type: object
            required:
            - generators
            - template
