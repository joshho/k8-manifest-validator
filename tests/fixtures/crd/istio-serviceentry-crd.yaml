apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceentries.networking.istio.io
spec:
  group: networking.istio.io
  names:
    kind: ServiceEntry
    plural: serviceentries
    singular: serviceentry
    listKind: ServiceEntryList
  scope: Namespaced
  versions:
  - name: v1alpha3
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              hosts:
                type: array
                items:
                  type: string
                minItems: 1
                description: "One or more hosts exposed by the ServiceEntry."
              ports:
                type: array
                items:
                  type: object
                  properties:
                    number:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    protocol:
                      type: string
                    name:
                      type: string
                    targetPort:
                      type: integer
                      minimum: 0
                      maximum: 65535
                  required:
                    - number
                    - protocol
                description: "Port definitions for the service."
              location:
                type: string
                enum:
                  - MESH_INTERNAL
                  - MESH_EXTERNAL
                  - EXTERNAL
                description: "Whether the service is internal or external."
              resolution:
                type: string
                enum:
                  - NONE
                  - STATIC
                  - DNS
                description: "How the service is resolved."
              endpoints:
                type: array
                items:
                  type: object
                  properties:
                    address:
                      type: string
                    ports:
                      type: object
                      additionalProperties:
                        type: integer
                    locality:
                      type: string
                    weight:
                      type: integer
                    network:
                      type: string
                    serviceAccount:
                      type: string
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                description: "Endpoint addresses and ports for the service."
              workloadSelector:
                type: object
                properties:
                  labels:
                    type: object
                    additionalProperties:
                      type: string
                description: "Selects the workloads to include in this ServiceEntry."
              subjectAltNames:
                type: array
                items:
                  type: string
                description: "Subject alternative names for the service."
            required:
              - hosts
              - ports
        required:
          - spec
  - name: v1beta1
    served: true
    storage: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              hosts:
                type: array
                items:
                  type: string
              ports:
                type: array
                items:
                  type: object
              location:
                type: string
              resolution:
                type: string
              endpoints:
                type: array
                items:
                  type: object
            required:
            - hosts
            - ports
