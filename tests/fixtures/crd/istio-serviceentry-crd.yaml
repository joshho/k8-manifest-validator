apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceentries.networking.istio.io
spec:
  group: networking.istio.io
  names:
    kind: ServiceEntry
    plural: serviceentries
    singular: serviceentry
    listKind: ServiceEntryList
  scope: Namespaced
  versions:
  - name: v1alpha3
    served: true
    storage: true
  - name: v1beta1
    served: true
    storage: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              hosts:
                type: array
                items:
                  type: string
              ports:
                type: array
              location:
                type: string
              resolution:
                type: string
              endpoints:
                type: array
            required:
            - hosts
            - ports