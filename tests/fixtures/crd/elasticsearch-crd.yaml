---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticsearches.elasticsearch.k8s.elastic.co
spec:
  group: elasticsearch.k8s.elastic.co
  names:
    kind: Elasticsearch
    plural: elasticsearches
    shortNames:
    - es
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - replicas
            properties:
              replicas:
                type: integer
                minimum: 0
              version:
                type: string
              nodeSets:
                type: array
                items:
                  type: object
                  required:
                  - name
                  - count
                  properties:
                    name:
                      type: string
                    count:
                      type: integer
                      minimum: 1
                    roles:
                      type: array
                      items:
                        type: string
                    storage:
                      type: object
                      properties:
                        size:
                          type: string