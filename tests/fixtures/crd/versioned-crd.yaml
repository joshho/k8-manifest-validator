apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: versioned.versioned.example.com
spec:
  group: versioned.example.com
  names:
    kind: Versioned
    plural: versioneds
    singular: versioned
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              replicas:
                type: integer
                minimum: 1
                maximum: 10
            required:
            - name
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
              replicas:
                type: integer
                minimum: 1
                maximum: 10
              image:
                type: string
            required:
            - name
            - image
