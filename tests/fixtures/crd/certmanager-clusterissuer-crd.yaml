apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterissuers.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: ClusterIssuer
    plural: clusterissuers
    singular: clusterissuer
    listKind: ClusterIssuerList
  scope: Cluster
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              acme:
                type: object
                properties:
                  server:
                    type: string
                  email:
                    type: string
                  privateKeySecretRef:
                    type: object
                    properties:
                      name:
                        type: string
                      key:
                        type: string
                    required:
                    - name
                  solvers:
                    type: array
                    items:
                      type: object
                      properties:
                        dns01:
                          type: object
                          properties:
                            route53:
                              type: object
                              properties:
                                region:
                                  type: string
                                hostedZoneID:
                                  type: string
                            cloudflare:
                              type: object
                              properties:
                                email:
                                  type: string
                                apiTokenSecretRef:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    key:
                                      type: string
                            http01:
                              type: object
                              properties:
                                ingressClassName:
                                  type: string
                        selector:
                          type: object
                          properties:
                            dnsZones:
                              type: array
                              items:
                                type: string
                            matchLabels:
                              type: object
                              additionalProperties:
                                type: string
                  externalAccountBinding:
                    type: object
                  preferredChain:
                    type: string
              ca:
                type: object
                properties:
                  secretName:
                    type: string
              vault:
                type: object
                properties:
                  path:
                    type: string
                  server:
                    type: string
              selfSigned:
                type: object
              venafi:
                type: object
                properties:
                  zone:
                    type: string
                  url:
                    type: string
                  apiTokenSecretRef:
                    type: object
                    properties:
                      name:
                        type: string
                      key:
                        type: string
          status:
            type: object
            properties:
              conditions:
                type: array
