apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificaterequests.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: CertificateRequest
    plural: certificaterequests
    singular: certificate-request
    listKind: CertificateRequestList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              issuerRef:
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                  group:
                    type: string
                required:
                - name
              commonName:
                type: string
              dnsNames:
                type: array
                items:
                  type: string
              ipAddresses:
                type: array
                items:
                  type: string
              emailSANs:
                type: array
                items:
                  type: string
              uriSANs:
                type: array
                items:
                  type: string
              usages:
                type: array
                items:
                  type: string
              request:
                type: string
                format: byte
              isCA:
                type: boolean
              encodeUsagesInRequest:
                type: boolean
              revision:
                type: integer
            required:
            - issuerRef
            - request
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
              ca:
                type: string
                format: byte
              certificate:
                type: string
                format: byte
