apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kustomizations.kustomize.toolkit.fluxcd.io
spec:
  group: kustomize.toolkit.fluxcd.io
  names:
    kind: Kustomization
    plural: kustomizations
    singular: kustomization
    listKind: KustomizationList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              interval:
                type: string
              path:
                type: string
              prune:
                type: boolean
              sourceRef:
                type: object
                properties:
                  kind:
                    type: string
                  name:
                    type: string
              targetNamespace:
                type: string
              timeout:
                type: string
              suspend:
                type: boolean
              dependsOn:
                type: array
                items:
                  type: string
              wait:
                type: boolean
              healthChecks:
                type: array
                items:
                  type: object
              retryInterval:
                type: string
            required:
            - interval
            - path
            - sourceRef
