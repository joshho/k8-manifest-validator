---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jaegers.jaegertracing.io
spec:
  group: jaegertracing.io
  names:
    kind: Jaeger
    plural: jaegers
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              strategy:
                type: string
                enum:
                - all
                - recreate
                - single
                - parallel
              collector:
                type: object
                properties:
                  resources:
                    type: object
                    properties:
                      limits:
                        type: object
                        additionalProperties:
                          type: string
                      requests:
                        type: object
                        additionalProperties:
                          type: string