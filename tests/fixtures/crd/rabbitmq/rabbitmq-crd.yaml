apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rabbitmqclusters.rabbitmq.com
spec:
  group: rabbitmq.com
  names:
    kind: RabbitmqCluster
    plural: rabbitmqclusters
    singular: rabbitmqcluster
    listKind: RabbitmqClusterList
    shortNames:
    - rmq
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
              resources:
                type: object
              persistence:
                type: object
                properties:
                  storageClass:
                    type: string
                  accessMode:
                    type: string
              service:
                type: object
              secretBackend:
                type: object
              tls:
                type: object
              additionalConfig:
                type: string
            required:
            - replicas
          status:
            type: object
        required:
        - spec