apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: prometheuses.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: Prometheus
    plural: prometheuses
    singular: prometheus
    listKind: PrometheusList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
              version:
                type: string
              image:
                type: string
              resources:
                type: object
                properties:
                  limits:
                    type: object
                  requests:
                    type: object
              serviceAccountName:
                type: string
              serviceMonitorSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                  matchExpressions:
                    type: array
                    items:
                      type: object
              podMonitorSelector:
                type: object
              ruleSelector:
                type: object
              alertmanagerConfigSelector:
                type: object
              retention:
                type: string
              retentionSize:
                type: string
              securityContext:
                type: object
                properties:
                  fsGroup:
                    type: integer
                  runAsNonRoot:
                    type: boolean
                  runAsUser:
                    type: integer
                  seLinuxOptions:
                    type: object
              containers:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    image:
                      type: string
                    env:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                    ports:
                      type: array
                      items:
                        type: object
                        properties:
                          containerPort:
                            type: integer
                    resources:
                      type: object
              volumes:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    persistentVolumeClaim:
                      type: object
                      properties:
                        claimName:
                          type: string
                    configMap:
                      type: object
                      properties:
                        name:
                          type: string
            required:
            - serviceAccountName