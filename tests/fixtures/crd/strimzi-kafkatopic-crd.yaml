apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kafkatopics.strimzi.io
spec:
  group: strimzi.io
  names:
    kind: KafkaTopic
    plural: kafkatopics
    singular: kafkatopic
    listKind: KafkaTopicList
  scope: Namespaced
  versions:
  - name: v1beta2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              partitions:
                type: integer
                minimum: 1
              replicas:
                type: integer
                minimum: 1
              config:
                type: object
              topicName:
                type: string
            required:
            - spec
            - partitions
            - replicas
        required:
        - spec
  storedVersions:
  - v1beta2
