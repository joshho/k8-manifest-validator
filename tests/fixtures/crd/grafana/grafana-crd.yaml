apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: grafanas.grafana.integreatly.org
spec:
  group: grafana.integreatly.org
  names:
    kind: Grafana
    plural: grafanas
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              replicas:
                type: integer
                minimum: 1
              version:
                type: string
              config:
                type: object
              resources:
                type: object
            required: [replicas]
