apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: ServiceMonitor
    plural: servicemonitors
    singular: servicemonitor
    listKind: ServiceMonitorList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              jobName:
                type: string
                minLength: 1
              endpoints:
                type: array
                items:
                  type: object
                  properties:
                    port:
                      type: string
                    url:
                      type: string
                    interval:
                      type: string
                    path:
                      type: string
                    scheme:
                      type: string
                    tlsConfig:
                      type: object
                    bearerTokenSecret:
                      type: object
                minItems: 1
              selector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                  matchExpressions:
                    type: array
                    items:
                      type: object
              namespaceSelector:
                type: object
                properties:
                  matchNames:
                    type: array
                    items:
                      type: string
              podTargetLabels:
                type: array
                items:
                  type: string
            required:
            - jobName
            - endpoints
            - selector