apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: ServiceMonitor
    plural: servicemonitors
    singular: servicemonitor
    listKind: ServiceMonitorList
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              jobName:
                type: string
              endpoints:
                type: array
                items:
                  type: object
              selector:
                type: object
              namespaceSelector:
                type: object
              podTargetLabels:
                type: array
                items:
                  type: string
            required:
            - jobName
            - endpoints
            - selector
