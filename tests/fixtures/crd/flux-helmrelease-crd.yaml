apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmreleases.helm.toolkit.fluxcd.io
spec:
  group: helm.toolkit.fluxcd.io
  names:
    kind: HelmRelease
    plural: helmreleases
    singular: helmrelease
    listKind: HelmReleaseList
  scope: Namespaced
  versions:
  - name: v2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              interval:
                type: string
              releaseName:
                type: string
              targetNamespace:
                type: string
              timeout:
                type: string
              suspend:
                type: boolean
              chart:
                type: object
                properties:
                  spec:
                    type: object
                    properties:
                      chart:
                        type: string
                      version:
                        type: string
                      sourceRef:
                        type: object
                        properties:
                          kind:
                            type: string
                          name:
                            type: string
                required:
                - spec
              values:
                type: object
              postRenderers:
                type: array
              install:
                type: object
              upgrade:
                type: object
              rollback:
                type: object
              uninstall:
                type: object
            required:
            - interval
            - chart