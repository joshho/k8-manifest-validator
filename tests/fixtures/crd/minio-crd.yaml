apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.minio.min.io
spec:
  group: minio.min.io
  names:
    kind: Tenant
    plural: tenants
    singular: tenant
    listKind: TenantList
  scope: Namespaced
  versions:
  - name: v2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              pools:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    servers:
                      type: integer
                      minimum: 1
                      maximum: 32
                    volumesPerServer:
                      type: integer
                      minimum: 1
                      maximum: 16
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                minItems: 1
              version:
                type: string
              image:
                type: string
              s3:
                type: object
                properties:
                  bucket:
                    type: string
                  endpoint:
                    type: string
                  region:
                    type: string
                  certSecret:
                    type: object
                    properties:
                      name:
                        type: string
                      enableAutoCert:
                        type: boolean
              certificates:
                type: object
                properties:
                  clientSecretName:
                    type: string
              features:
                type: object
                properties:
                  bucketDNS:
                    type: boolean
                  encryption:
                    type: boolean
            required:
            - pools
            - version
          status:
            type: object
            properties:
              availableReplicas:
                type: integer
              state:
                type: string
