---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  log-level: "info"
  feature-flags: "new-ui,batch-jobs"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixed-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
---
apiVersion: example.com/v1
kind: Database
metadata:
  name: mixed-database
  namespace: default
spec:
  engine: mysql
  version: "8.0"