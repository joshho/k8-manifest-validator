# Invalid Deployment - wrong kind (should be Deployment not Deployement)
apiVersion: apps/v1
kind: Deployement
metadata:
  name: my-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.21