apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-prometheus-rule
  namespace: monitoring
spec:
  groups:
  - name: multi
    rules:
    - alert: HighMemory
      expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
      for: 5m
      labels:
        severity: warning
    - alert: HighCPU
      expr: rate(process_cpu_seconds_total[5m]) > 0.8
      for: 5m
      labels:
        severity: warning