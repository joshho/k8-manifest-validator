apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 3
  serviceAccountName: alertmanager
  containers:
  - name: alertmanager
    image: quay.io/prometheus/alertmanager:v0.26.0
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi