apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: my-project
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/argoproj/argocd-example-apps
  destinations:
  - server: https://kubernetes.default.svc
    namespace: production
  syncWindows:
  - kind: deny
    schedule: "* * * * *"
    duration: 1h