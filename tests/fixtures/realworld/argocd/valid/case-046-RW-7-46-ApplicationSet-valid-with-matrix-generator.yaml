apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-appset
  namespace: argocd
spec:
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/argoproj/argocd-example-apps
          revision: HEAD
      - clusters:
          values:
            namespace: production
  template:
    metadata:
      name: '{{path.basename}}-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argocd-example-apps
        path: '{{path.basename}}'
        targetRevision: HEAD
      destination:
        server: https://kubernetes.default.svc
        namespace: production