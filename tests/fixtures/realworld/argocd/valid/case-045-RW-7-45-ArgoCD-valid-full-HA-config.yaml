apiVersion: argoproj.io/v1alpha1
kind: ArgoCD
metadata:
  name: argocd-ha
  namespace: argocd
spec:
  image: quay.io/argoproj/argocd
  version: v2.8.0
  server:
    replicas: 5
    host: argocd-ha.example.com
  repo:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  controller:
    replicas: 3
  redis: {}
  metrics:
    enabled: true
  rbac: {}