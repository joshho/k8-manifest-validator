apiVersion: etcd.database.coreos.com/v1beta2
kind: EtcdCluster
metadata:
  name: etcd-with-affinity
  namespace: default
spec:
  size: 3
  pod:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "node-role.kubernetes.io/infra"
                  operator: In
                  values:
                    - "etcd"
    tolerations:
      - key: "node-role"
        operator: "Equal"
        value: "etcd"
        effect: "NoSchedule"