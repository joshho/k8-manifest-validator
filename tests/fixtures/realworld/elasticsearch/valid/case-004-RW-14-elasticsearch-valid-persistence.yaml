apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-persistent
  namespace: elastic-system
spec:
  replicas: 3
  version: "8.12.0"
  nodeSets:
  - name: data-node
    count: 3
    roles:
    - master
    - data
    - ingest
    storage:
      size: 200Gi
      storageClassName: gp3
    persistence:
      size: 200Gi
