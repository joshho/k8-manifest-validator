apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-multi-nodeset
  namespace: elastic-system
spec:
  replicas: 6
  version: "8.11.0"
  nodeSets:
  - name: master
    count: 3
    roles:
    - master
    - remote_cluster_client
    storage:
      size: 20Gi
  - name: data
    count: 3
    roles:
    - data
    storage:
      size: 100Gi