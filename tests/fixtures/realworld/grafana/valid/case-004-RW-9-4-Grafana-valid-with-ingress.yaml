apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-with-ingress
  namespace: monitoring
spec:
  ingress:
    metadata:
      annotations:
        kubernetes.io/ingress.class: nginx
    spec:
      rules:
      - host: grafana.example.com
        http:
          paths:
          - backend:
              service:
                name: grafana-service
                port:
                  number: 3000
            path: /
            pathType: Prefix
  replicas: 1
  version: 11.0.0
