apiVersion: postgres-operator.crunchydata.com/v1
kind: Pgcluster
metadata:
  name: my-postgres
  namespace: postgres-operator
spec:
  name: my-postgres
  postgresVersion: 14
  serviceType: LoadBalancer
  instances:
  - name: instance1
    replicas: 1
    dataVolumeClaimSpec:
      resources:
        requests:
          storage: 10Gi