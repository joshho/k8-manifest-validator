apiVersion: postgres-operator.crunchydata.com/v1
kind: Pgcluster
metadata:
  name: my-postgres
  namespace: postgres-operator
spec:
  name: my-postgres
  postgresVersion: 13
  image: crunchydata/crunchy-postgres:centos7-13.4-2
  imagePullPolicy: Always
  instances:
  - name: instance1
    replicas: 1
    dataVolumeClaimSpec:
      resources:
        requests:
          storage: 1Gi