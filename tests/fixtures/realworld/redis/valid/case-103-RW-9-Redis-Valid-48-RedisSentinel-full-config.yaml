apiVersion: redisilient.github.com/v1
kind: RedisSentinel
metadata:
  name: my-sentinel
  namespace: default
spec:
  kubernetesConfig:
    image: redis:7.0
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
  sentinelConfig:
    quorum: 2
    downAfterMilliseconds: 30000
    failTimeout: 180000
  redisConfig:
    maxmemory: 512mb
    maxmemoryPolicy: allkeys-lru