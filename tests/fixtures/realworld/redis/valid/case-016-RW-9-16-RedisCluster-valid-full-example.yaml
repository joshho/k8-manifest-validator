apiVersion: redisilient.github.com/v1
kind: RedisCluster
metadata:
  name: my-redis-cluster
  namespace: default
spec:
  kubernetesConfig:
    image: redis:7.0
    imagePullPolicy: IfNotPresent
    env:
    - name: REDIS_PASSWORD
      value: clustersecret
    resources:
      limits:
        cpu: "4"
        memory: 4Gi
  clusterSize: 3
  redisConfig:
    maxmemory: 2gb
    maxmemoryPolicy: allkeys-lru
    appendonly: "yes"
  storage:
    persistentVolumeClaim:
      metadata:
        name: cluster-pvc
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi