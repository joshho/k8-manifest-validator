apiVersion: redisilient.github.com/v1
kind: RedisSentinel
metadata:
  name: my-redis-sentinel
  namespace: default
spec:
  kubernetesConfig:
    image: redis:7.0
  storage:
    persistentVolumeClaim:
      metadata:
        name: sentinel-pvc
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi