apiVersion: redisilient.github.com/v1
kind: Redis
metadata:
  name: my-redis
  namespace: default
spec:
  kubernetesConfig:
    image: redis:7.0
  redis:
    storage:
      persistentVolumeClaim:
        metadata:
          name: redis-pvc
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi