apiVersion: redisilient.github.com/v1
kind: RedisCluster
metadata:
  name: my-redis-cluster
  namespace: default
spec:
  kubernetesConfig:
    image: redis:7.0-cluster
  clusterSize: 3
  storage:
    persistentVolumeClaim:
      metadata:
        name: redis-cluster-pvc
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        storageClassName: fast-ssd