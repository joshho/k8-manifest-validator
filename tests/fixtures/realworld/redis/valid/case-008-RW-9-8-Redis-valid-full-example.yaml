apiVersion: redisilient.github.com/v1
kind: Redis
metadata:
  name: my-redis
  namespace: default
spec:
  kubernetesConfig:
    image: redis:7.0
    imagePullPolicy: IfNotPresent
    env:
    - name: REDIS_PASSWORD
      value: secretpassword
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
  redis:
    storage:
      persistentVolumeClaim:
        metadata:
          name: redis-pvc
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    config:
      maxmemory: 1gb
      maxmemoryPolicy: allkeys-lru
  sentinel:
    replicas: 3
    image: redis:7.0