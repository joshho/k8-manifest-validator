apiVersion: redisilient.github.com/v1
kind: RedisCluster
metadata:
  name: my-redis-cluster
  namespace: default
spec:
  kubernetesConfig:
    image: redis:7.0
  clusterSize: 5
  redisConfig:
    maxmemoryPolicy: allkeys-lru
  storage:
    persistentVolumeClaim:
      metadata:
        name: cluster-pvc
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi