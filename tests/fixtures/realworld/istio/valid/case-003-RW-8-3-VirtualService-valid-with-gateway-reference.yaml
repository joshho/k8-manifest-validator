apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: gateway-route
  namespace: istio-system
spec:
  hosts:
  - bookinfo.example.com
  gateways:
  - istio-system/bookinfo-gateway
  http:
  - route:
    - destination:
        host: productpage
        port:
          number: 9080