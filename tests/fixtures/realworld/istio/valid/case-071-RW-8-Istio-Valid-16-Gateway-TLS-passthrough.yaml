apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: passthrough-gw
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: tls
      protocol: TLS
    tls:
      mode: PASSTHROUGH
    hosts:
    - "secure.example.com"