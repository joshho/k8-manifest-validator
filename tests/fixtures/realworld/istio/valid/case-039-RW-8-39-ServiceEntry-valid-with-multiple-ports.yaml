apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: multi-port-svc
  namespace: default
spec:
  hosts:
  - multiport.example.com
  ports:
  - number: 80
    name: http
    protocol: HTTP
  - number: 443
    name: https
    protocol: HTTPS
  - number: 9090
    name: grpc
    protocol: GRPC
  location: MESH_EXTERNAL
  resolution: DNS