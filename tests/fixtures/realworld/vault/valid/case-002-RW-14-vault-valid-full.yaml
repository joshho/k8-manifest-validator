apiVersion: vault.security.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault-full
  namespace: vault-ns
spec:
  size: 3
  version: "1.12.0"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  encyrptor:
    enabled: true
  externalConfig:
    ui: true
    annotations:
    - key: env
      value: production
