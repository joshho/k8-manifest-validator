apiVersion: strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: my-mm2
  namespace: kafka
spec:
  replicas: 2
  connectCluster: target-cluster
  mirrors:
  - sourceCluster: source-a
    targetCluster: target-cluster
    sourceTopic: topic-a
  resources:
    limits:
      cpu: "1"
      memory: 2Gi