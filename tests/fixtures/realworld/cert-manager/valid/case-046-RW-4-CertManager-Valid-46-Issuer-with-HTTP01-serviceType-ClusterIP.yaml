apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: http01-svc-issuer
  namespace: default
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: acme-account-key
    solvers:
    - dns01:
        http01:
          ingressClassName: nginx
          serviceType: ClusterIP