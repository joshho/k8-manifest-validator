apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: multi-solver-issuer
  namespace: default
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: acme-account-key
    solvers:
    - selector:
        dnsZones:
          - example.com
      dns01:
        route53:
          region: us-east-1
    - selector:
        dnsZones:
          - "*.example.com"
      dns01:
        cloudflare:
          email: admin@example.com
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-key