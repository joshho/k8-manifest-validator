apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: matchlabels-issuer
  namespace: default
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: acme-account-key
    solvers:
    - selector:
        matchLabels:
          environment: production
          team: platform
      dns01:
        route53:
          region: us-east-1