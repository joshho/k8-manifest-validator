apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: template-anno-cert
  namespace: default
spec:
  secretName: template-anno-tls
  issuerRef:
    name: my-issuer
  secretTemplate:
    annotations:
      example.com/owner: platform-team
      example.com/version: "1.0"
  dnsNames:
    - template.example.com