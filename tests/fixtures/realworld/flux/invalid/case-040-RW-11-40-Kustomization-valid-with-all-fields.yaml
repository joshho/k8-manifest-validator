apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-full
  namespace: flux-system
spec:
  interval: 3m0s
  path: ./deploy
  targetNamespace: production
  timeout: 15m0s
  prune: true
  suspend: false
  dependsOn:
    - infra
    - monitoring
  wait: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: podinfo