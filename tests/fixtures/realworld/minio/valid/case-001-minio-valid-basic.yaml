apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio-valid-full-config
spec:
  pools:
    - name: pool-1
      servers: 8
      volumesPerServer: 4
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
  version: "RELEASE.2024-01-16T16-30-29Z"
  image: "minio/minio:latest"
  s3:
    bucket: "prod-bucket"
    endpoint: "s3.example.com"
    region: "us-west-2"
  features:
    bucketDNS: true
    encryption: true