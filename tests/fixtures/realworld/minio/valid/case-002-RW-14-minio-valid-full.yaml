apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio-full
  namespace: minio
spec:
  pools:
  - name: pool-1
    servers: 4
    volumesPerServer: 4
    resources:
      requests:
        cpu: 1000m
        memory: 4Gi
      limits:
        cpu: 2000m
        memory: 8Gi
  - name: pool-2
    servers: 2
    volumesPerServer: 8
    resources:
      requests:
        cpu: 2000m
        memory: 16Gi
      limits:
        cpu: 4000m
        memory: 32Gi
  version: RELEASE.2024-01-16T19-43-48Z
  image: minio/minio:latest
  s3:
    bucket: data
    endpoint: s3.example.com
    region: us-east-1
  features:
    bucketDNS: true
    encryption: true
