# .pre-commit-config.yaml
# Local validation hooks for k8-manifest-validator
#
# Install:     pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Update:      pre-commit autoupdate

repos:
  # ── Local hooks ────────────────────────────────────────────────────────────

  - repo: local
    hooks:
      # Fast smoke: binary version + help (no file I/O)
      - id: binary-smoke
        name: Binary smoke (--version, --help)
        entry: |
          sh -c 'if ! /home/node/.openclaw/workspace/github/SWE/swe-k8-manifest-validator/workspace/dist/k8-manifest-validator --version >/dev/null 2>&1; then
            echo "ERROR: dist/k8-manifest-validator not found or broken"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # Full fixture + realworld test suite via scripts/test.sh
      - id: fixture-tests
        name: Fixture tests (scripts/test.sh)
        entry: bash
        args: [scripts/test.sh]
        language: system
        pass_filenames: false
        always_run: true
        stages: [push]   # skip on commit-stage (too slow for every file edit)